server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker may assign a new IP whenever the backend container restarts.
    # A variable makes Nginx resolve the service name for each request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /actuator/ {
        proxy_pass http://$backend_upstream$request_uri;
    }
}
