server {
    listen 80;
    listen [::]:80;
    server_name zhigangmap.xyz www.zhigangmap.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/zhigangmap;
    }

    location / {
        return 301 https://zhigangmap.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zhigangmap.xyz www.zhigangmap.xyz;

    # Preserve the existing certificate paths when installing on the current server.
    ssl_certificate /etc/ssl/zhigangmap/fullchain.cer;
    ssl_certificate_key /etc/ssl/zhigangmap/zhigangmap.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/zhigangmap/current/frontend;
    index index.html;
    client_max_body_size 30m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /index.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/security/professional/login {
        limit_req zone=zhigang_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/api/security/professional/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/resumes/(file|files)$ {
        client_max_body_size 10m;
        limit_req zone=zhigang_write burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=zhigang_write burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /actuator/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }

    location ~ ^/(swagger-ui|v3/api-docs|actuator/) {
        return 404;
    }
}
