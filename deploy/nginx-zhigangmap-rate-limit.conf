# This file must be included from nginx http {} context before the site vhost uses the zones.
map $request_method $zhigang_write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=zhigang_login:10m rate=5r/m;
limit_req_zone $zhigang_write_key zone=zhigang_write:10m rate=30r/m;
limit_req_status 429;
